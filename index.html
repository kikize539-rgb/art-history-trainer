<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>美术史·背诵手册</title>
<meta name="theme-color" content="#A64B2A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="美术史">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#26221C;--paper:#F4F2EC;--card:#FFFDF8;--line:#DFD9CB;--mute:#8B8478;--seal:#AE3226;--cn:#A64B2A;--fw:#3B5686;--ok:#3E7A45;--warn:#B98A2F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px}
.serif{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 90px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:10px 0 8px;color:var(--mute);font-size:12px;cursor:pointer}
.nav button.on{color:var(--cn);font-weight:700}
.nav .ico{display:block;font-size:20px;margin-bottom:2px}
h1{font-size:24px;text-align:center;letter-spacing:6px;margin:10px 0 2px}
.sub{text-align:center;color:var(--mute);font-size:11px;letter-spacing:2px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.seal{color:var(--seal);border-color:var(--seal)}
.chip.seal.on{background:var(--seal);color:#fff}
.bigbtn{display:block;width:100%;border:0;border-radius:14px;padding:15px;color:#fff;font-size:17px;font-weight:700;margin-bottom:10px;cursor:pointer;font-family:inherit}
.bigbtn small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:2px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:var(--seal);border-color:var(--seal)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--mute);margin:0 4px 4px 0}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:2px 9px;color:#fff}
.seal-stamp{position:absolute;top:10px;right:10px;transform:rotate(7deg);border:2px solid var(--seal);color:var(--seal);font-size:11px;font-weight:700;text-align:center;padding:3px 6px;border-radius:3px;line-height:1.2}
.study{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 18px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:-moz-none;user-select:none}
.term{font-size:26px;font-weight:700;line-height:1.4;margin-top:14px}
.ans{font-size:14px;line-height:1.9;text-align:left;white-space:pre-wrap}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.g3 button{border:0;border-radius:10px;padding:13px 0;color:#fff;font-size:14px;cursor:pointer}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:15px;margin-bottom:8px;cursor:pointer;font-family:inherit}
.top{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:12px}
textarea,input[type=text],input[type=number],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
label{font-size:12px;color:var(--mute);display:block;margin:10px 0 4px}
.bar{height:8px;background:#E9E4D8;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--cn);border-radius:99px}
.stat{display:flex;text-align:center}
.stat>div{flex:1}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--mute)}
.cols{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:10px}
.cols>div{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.cols i{display:block;background:var(--fw);border-radius:4px 4px 0 0;margin:0 auto 3px;width:70%;min-height:2px}
.item{display:flex;align-items:center;gap:8px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.star{font-size:18px;cursor:pointer;flex:none}
.modal{position:fixed;inset:0;background:rgba(30,25,20,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 30px}
.muted{color:var(--mute);font-size:12px}
.center{text-align:center}
.mt{margin-top:10px}
.done-ico{font-size:44px;margin-bottom:8px}
.mnode{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;margin:3px 0;font-size:13px}
.mlink{font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.mkids{margin-left:10px;padding-left:12px;border-left:2px solid var(--line);margin-bottom:4px}
</style>
</head>
<body>
<div id="app"></div>
<div class="nav" id="nav"></div>
<script>
"use strict";
/* ================= 题库(内置) ================= */
const D=[
// ---------- 中国美术史 ----------
["c","史前","彩陶","新石器时代绘黑、红等彩绘纹饰的陶器;仰韶文化(半坡、庙底沟类型)与马家窑文化最发达;纹样有几何纹、动植物纹、人面鱼纹等;集原始绘画与工艺之大成。",2,"17·23","n"],
["c","史前","黑陶(蛋壳陶)","新石器晚期山东龙山文化代表陶器;轮制,胎薄质坚,乌黑光亮,以「黑、薄、光、纽」著称;蛋壳陶高柄杯壁薄不足1毫米,为史前制陶工艺的极致。",1,"25","n"],
["c","史前","拟形陶","模拟动物或人形制作的陶器;如仰韶鹰形鼎、大汶口猪形鬶;实用器与雕塑造型结合,反映原始审美与图腾观念。",1,"24","n"],
["c","史前","马家窑彩陶","甘青地区新石器晚期彩陶;分马家窑、半山、马厂三类型;纹饰以旋涡纹、水波纹著称,线条流动、构图繁密;《舞蹈纹彩陶盆》为名作,代表彩陶艺术高峰。",1,"15","j"],
["c","史前","玉器在先秦社会的作用和意义","新石器红山、良渚玉器已发达(玉龙、玉琮);由巫而礼:「六器」礼天地四方,标示等级身份;「君子比德于玉」,成为道德人格象征;推动琢玉工艺与审美发展。",1,"25","j"],
["c","史前","原始陶器的器形与器表装饰","器形:实用与美观结合,出现拟形陶;器表:彩绘、磨光、压印、堆贴、镂刻;纹样由写实动植物纹渐趋抽象几何纹;装饰部位与使用视角相适应。",1,"18","j"],
["c","史前","原始绘画与雕塑的主要成就","绘画:彩陶纹饰、《鹳鱼石斧图》、岩画(阴山狩猎、将军崖农耕祭祀);雕塑:红山裸体女神像、人头形器口瓶、陶鹰鼎、玉龙玉琮;多与巫术崇拜相关。",0,"","j"],
["c","先秦","青铜器","商周以铜锡合金铸造的器物,礼器为大宗;「藏礼于器」,为权力等级的象征;纹饰以饕餮纹为代表,狞厉神秘;司母戊鼎、四羊方尊为名作。",1,"14","n"],
["c","先秦","饕餮纹(兽面纹)","商周青铜器的主体纹样;正面展开的兽面,双目圆睁;狞厉神秘,象征王权与神性,体现「狞厉之美」;西周中期后渐被环带纹、窃曲纹取代。",0,"","n"],
["c","先秦","甲骨文","商代刻于龟甲兽骨上的占卜记事文字;现存最早成体系的汉字;笔画瘦劲挺直,结体随形变化,已具书法之美。",1,"21","n"],
["c","先秦","金文","铸刻于青铜器上的铭文,又称钟鼎文;西周最盛,《毛公鼎》《散氏盘》《大盂鼎》为代表;笔画浑厚圆润、结体庄重,开篆书先河。",1,"25","n"],
["c","先秦","石鼓文","刻于十枚鼓形石上的先秦文字,内容为记游猎的四言诗;现存最早的石刻文字;属大篆(籀文),笔画匀圆浑厚、结体方正,被誉为「书家第一法则」。",2,"13·18","n"],
["c","先秦","帛画","绘于丝织物上的绘画;战国楚墓《人物龙凤帛画》《人物御龙图》为现存最早的独幅绘画;性质为引魂升天的旌幡;以墨线勾描为主,奠定中国画以线造型的传统。",1,"22","n"],
["c","先秦","战国帛画的代表及其基本形态","代表:《人物龙凤帛画》《人物御龙图》;性质:葬仪旌幡,主题为引魂升天;形态:人物侧面立像,墨线勾描、平涂设色,以线造型的传统由此确立。",1,"23","j"],
["c","先秦","青铜艺术的兴衰过程和原因","育成期(夏至商早期)→鼎盛期(商晚至西周初,狞厉神秘)→转变期(西周中后期,简朴理性)→更新期(春秋战国,轻巧华丽、生活化,金银错等新工艺);兴衰随礼乐制度盛衰与铁器时代到来而变化。",0,"","j"],
["c","先秦","先秦雕刻艺术风格及代表作","青铜拟形雕塑庄重奇伟(四羊方尊、莲鹤方壶);三星堆青铜立人与面具神秘夸张;玉雕精巧;楚地木雕镇墓兽想象诡谲;整体服务于礼制巫术,象征装饰性强。",1,"24","j"],
["c","秦汉","画像石","汉代祠堂、墓室、石阙等石材上的雕刻图像;题材有经史故事、神仙祥瑞、生产生活;以山东武氏祠、孝堂山石祠为代表;被誉为「绣像的汉代史」。",1,"19","n"],
["c","秦汉","汉代画像石的形态·题材·特色","存在形态:祠堂、墓室、石阙、石棺构件;题材:历史故事、神话祥瑞、生产生活、天文星象;特色:以线造型与减地平雕结合,剪影式造型,构图饱满,质朴雄劲、深沉雄大。",1,"22","l"],
["c","秦汉","霍去病墓石雕","西汉纪念碑性石雕群,封土象祁连山;「循石造型」,因材施艺,雕绘浑然一体;风格浑厚古拙、雄大深沉;主雕《马踏匈奴》象征卫国武功,另有伏虎、跃马等。",1,"12","j"],
["c","秦汉","秦始皇兵马俑","主题:护卫陵寝、彰显帝国军威(事死如事生);艺术:写实严谨、千人千面,塑绘结合;规模宏大、阵列整肃,气势崇高;中国古代写实雕塑的高峰。",3,"13·16·21","j"],
["c","秦汉","马王堆T型帛画","西汉长沙马王堆一号墓「非衣」;自上而下分绘天界、人间、地下;主题为引魂升天;线描精谨、设色绚烂,代表汉初绘画最高水平。",0,"","j"],
["c","秦汉","隶书与汉碑","隶书为汉代通行书体,由篆书简化而来;蚕头燕尾、一波三磔,化圆为方;《曹全碑》秀逸多姿,《张迁碑》方劲雄强;东汉碑刻为隶书艺术高峰。",0,"","n"],
["c","魏晋南北朝","顾恺之","东晋画家,史称才绝、画绝、痴绝;提出「以形写神」「迁想妙得」;传世摹本《女史箴图》《洛神赋图》《列女仁智图》;线描连绵如春蚕吐丝;奠定传神论基础。",2,"13·25","n"],
["c","魏晋南北朝","六法","南齐谢赫《古画品录》提出:气韵生动、骨法用笔、应物象形、随类赋彩、经营位置、传移模写;中国绘画首个系统的创作与品评标准,「六法精论,万古不移」。",3,"12·17·25","n"],
["c","魏晋南北朝","谢赫《古画品录》","南齐谢赫著,现存最早的绘画品评专著;提出「六法」;以之为标准将曹不兴以来27位画家分为六品;确立中国画品评体系,影响深远。",1,"22","j"],
["c","魏晋南北朝","曹衣出水","北齐曹仲达所创佛画样式(曹家样);衣纹稠密贴体,如刚从水中出来;源出中亚犍陀罗风格;与吴道子「吴带当风」对举。",1,"23","n"],
["c","魏晋南北朝","六朝三杰","顾恺之、陆探微、张僧繇;「象人之美:顾得其神,陆得其骨,张得其肉」;分别以传神、骨法、体量见长,代表六朝人物画的最高成就;张僧繇创疏体、吸收凹凸法。",0,"","n"],
["c","魏晋南北朝","二王","东晋王羲之、王献之父子;羲之变古质为妍美,《兰亭序》称天下第一行书,尊为「书圣」;献之创「破体」,媚趣多姿;确立帖学传统,影响千余年。",0,"","n"],
["c","魏晋南北朝","畅神","南朝宗炳《画山水序》提出;谓山水画的功能在使精神愉悦舒畅,「畅神而已」;主张山水「以形媚道」,可卧游其间;标志山水审美意识的自觉。",0,"","n"],
["c","魏晋南北朝","昙曜五窟","北魏文成帝时沙门统昙曜主持开凿的云冈第16—20窟;五尊主佛象征北魏五帝,「皇帝即当今如来」;造像雄浑伟岸,融犍陀罗、凉州风格;云冈最早最宏伟的工程。",1,"24","n"],
["c","魏晋南北朝","本生故事画","描绘释迦牟尼前世舍身行善事迹的佛教绘画;盛于北朝敦煌、克孜尔诸石窟;《鹿王本生》《萨埵那太子舍身饲虎》为代表;情节悲壮,宣扬牺牲忍辱,悲剧色彩浓烈。",1,"24","j"],
["c","魏晋南北朝","竹林七贤与荣启期画像砖","南朝大墓模印拼镶砖画,南京西善桥出土;七贤与荣启期分坐银杏垂柳之间;线条流畅劲挺;体现魏晋名士风度与「秀骨清像」的审美理想。",0,"","n"],
["c","魏晋南北朝","麦积山石窟北朝造像","甘肃天水麦积山,以泥塑著称,「东方雕塑陈列馆」;北魏塑像秀骨清像、褒衣博带;西魏北周渐趋丰圆敦厚;造像温婉含蓄,富人间情味。",1,"25","j"],
["c","魏晋南北朝","龙门石窟北朝造像","北魏迁都洛阳后开凿,古阳洞、宾阳中洞为代表;秀骨清像、褒衣博带,汉化风格成熟;《帝后礼佛图》浮雕庄严华美;龙门二十品为魏碑书法精华。",0,"","j"],
["c","魏晋南北朝","魏晋南北朝美术的总体特色","美术走向自觉:专业画家书家辈出(顾陆张、二王);画论诞生(六法、传神论、畅神说);佛教石窟艺术空前繁荣(敦煌、云冈、龙门、麦积山);山水画萌芽;为隋唐盛世奠基。",0,"","l"],
["c","隋唐","展子虔","隋代画家;《游春图》为现存最早的卷轴山水画;青绿勾填,「远近山川,咫尺千里」;改变了「人大于山、水不容泛」的稚拙面貌,开青绿山水先河。",1,"21","n"],
["c","隋唐","阎立本","初唐人物画家;《步辇图》记录唐太宗接见吐蕃使者禄东赞;《历代帝王图》以形写神、辨其贤愚;铁线描健劲,设色沉着。",0,"","n"],
["c","隋唐","吴道子","盛唐「画圣」;以状如莼菜条的线描创「吴带当风」样式,敷色简淡称「吴装」;一生画壁三百余堵,《送子天王图》传其风格;将线描表现力与宗教画的中国化推向高峰。",1,"19","n"],
["c","隋唐","张萱与周昉","盛唐张萱写贵族妇女生活,《虢国夫人游春图》《捣练图》丰腴华丽;中晚唐周昉创「周家样」与水月观音之体,《簪花仕女图》《挥扇仕女图》写尽宫闱闲愁;唐代绮罗人物画双峰。",0,"","n"],
["c","隋唐","王维","盛唐诗人画家;「诗中有画,画中有诗」;传创水墨渲淡与破墨山水,《辋川图》著录于世;被董其昌推为南宗之祖,后世文人画的精神源头。",0,"","n"],
["c","隋唐","青绿山水","以石青、石绿为主色的山水画体;勾线填色、金碧辉煌;展子虔开端,李思训、李昭道父子(大小李将军)臻于成熟;《江帆楼阁图》《明皇幸蜀图》为代表。",1,"19","n"],
["c","隋唐","昭陵六骏","唐太宗昭陵祭坛的六块战马浮雕,纪念开国所乘六骏;造型雄健、写实传神;「飒露紫」「拳毛騧」流失美国;唐代陵墓雕刻杰作。",2,"15·23","n"],
["c","隋唐","唐三彩","唐代多彩低温铅釉陶器,以黄、绿、白为主;多作随葬明器,马、骆驼、仕女俑最精;釉色斑斓流淌、造型饱满,尽显盛唐气象。",1,"22","n"],
["c","隋唐","颜真卿(颜筋柳骨)","盛唐书法家;创颜体:雄浑宽博、外拓丰腴,含篆籀气;《颜勤礼碑》《多宝塔碑》,《祭侄文稿》为天下第二行书;与柳公权瘦硬挺拔并称「颜筋柳骨」,唐楷两大典范。",0,"","n"],
["c","隋唐","癫张狂素","盛中唐狂草双峰张旭与怀素;张旭嗜酒以头濡墨号「张颠」,怀素「骤雨旋风」称「狂素」;将草书的抒情性推向极致,浪漫主义书风的高峰。",0,"","n"],
["c","隋唐","张彦远《历代名画记》","晚唐张彦远著,中国第一部系统绘画通史;叙画史源流与功能(成教化助人伦)、论六法师承、记两京寺观壁画、录370余位画家传记,兼及鉴藏;史论结合,「画史之祖」。",2,"19·24","j"],
["c","隋唐","唐代山水画的发展","初盛唐李思训父子青绿金碧、工致富丽;吴道子疏体山水一日而就嘉陵三百里;中唐王维、张璪水墨渲淡兴起(水墨之变);山水独立成科,形成青绿与水墨两大体系。",1,"19","j"],
["c","隋唐","唐代敦煌莫高窟的发展变化","与魏晋北朝相比:题材由本生苦修转为宏大欢乐的经变画(净土变);彩塑丰腴健美、世俗化(菩萨如宫娃);出现巨型大像与涅槃像;供养人像增大;线描设色成熟,尽显盛世气象。",1,"22","j"],
["c","隋唐","唐代社会背景与美术总体特色","背景:国力强盛、中外交流、三教并行、城市繁荣;特色:兼容并蓄、恢宏博大;人物画鼎盛(阎吴张周),山水花鸟独立成科,书法诸体皆备;宗教美术世俗化;整体呈雄浑丰满的盛唐气象。",1,"20","l"],
["c","五代两宋","荆关董巨","五代山水四大家;北方荆浩、关仝写太行关陕之雄(《匡庐图》《关山行旅图》),荆浩著《笔法记》提出六要;江南董源、巨然写江南之秀润(《潇湘图》,披麻皴、点子矾头);奠定山水南北两大体系。",1,"20","n"],
["c","五代两宋","《韩熙载夜宴图》","五代南唐顾闳中奉后主命夜窥韩宅而作;听乐、观舞、歇息、清吹、送别五段,屏风分隔又连贯;工笔重彩;刻画韩熙载纵情声色下的抑郁心境,心理描写深刻;古代人物画巅峰。",1,"25","j"],
["c","五代两宋","徐黄异体","五代花鸟两大体格;黄筌(西蜀)「黄家富贵」:勾勒填彩、精工艳丽,写宫苑珍禽;徐熙(南唐)「徐熙野逸」:落墨为格、傅色简淡,写汀花野竹;奠定花鸟画工笔与写意两大传统。",0,"","n"],
["c","五代两宋","李成与范宽","北宋初山水双峰;李成写齐鲁平远寒林,惜墨如金、创蟹爪枝(《读碑窠石图》);范宽居终南太华,「与其师人不若师诸造化」,《溪山行旅图》正面巨嶂、雨点皴、浑厚雄峻;一文一武,北方山水典范。",0,"","j"],
["c","五代两宋","郭熙与《林泉高致》","北宋中期院体山水大家;《早春图》卷云皴、蟹爪枝写早春微妙气象;其子郭思纂其画论为《林泉高致》:提出三远、「身即山川而取之」、山水须可行可望可游可居;北宋山水理论集大成。",0,"","n"],
["c","五代两宋","三远","郭熙《林泉高致》提出的山水空间构图法:自山下仰山巅谓之高远,自山前窥山后谓之深远,自近山望远山谓之平远;「高远之势突兀,深远之意重叠,平远之意冲融」;山水空间理论的经典。",2,"12·25","n"],
["c","五代两宋","米点山水(米氏云山)","北宋米芾、米友仁父子所创;以侧笔横点层层积叠(落茄点),写江南烟云变灭;「信笔作之,意似便已」,尚天真平淡;文人墨戏山水的典型。",2,"13·15","n"],
["c","五代两宋","张择端《清明上河图》","北宋末风俗画长卷;绘汴京清明时节汴河两岸市井繁华;散点透视,人物五百余,舟车店铺无不精到;界画与写实结合;古代风俗画巅峰。",0,"","n"],
["c","五代两宋","南宋四家","李唐、刘松年、马远、夏圭;承李唐水墨苍劲一路,大斧劈皴;马远「马一角」、夏圭「夏半边」,边角构图、计白当黑,空灵诗意;《踏歌图》《溪山清远图》为代表。",0,"","n"],
["c","五代两宋","梁楷与减笔人物","南宋画院画家梁楷,号梁疯子;以极简笔墨与泼墨写人物,笔简神完;《泼墨仙人图》《李白行吟图》;开后世大写意人物画先河。",0,"","n"],
["c","五代两宋","李公麟","北宋文人画家;白描大师,「扫去粉黛、淡毫轻墨」,使白描成为独立画科;《五马图》《维摩演教图》;鞍马人物道释皆精;文人趣味与精深功力兼备,「宋画中第一人」。",1,"25","l"],
["c","五代两宋","苏黄米蔡的书法艺术","宋四家共开「尚意」书风,变唐人尚法为抒写性灵;苏轼丰腴跌宕天真烂漫(《黄州寒食帖》);黄庭坚中宫紧收、长枪大戟;米芾八面出锋、沉着痛快;蔡襄端庄温淳、恪守法度。",0,"","j"],
["c","五代两宋","两宋文人士大夫绘画","苏轼首倡「士人画」:「论画以形似,见与儿童邻」,重神似意气;文同墨竹(胸有成竹)、米氏云山、李公麟白描为实践;主张诗画一律、寄兴写意;与院体对峙互补,为元明清文人画奠基。",1,"17","j"],
["c","五代两宋","北宋与南宋山水画的不同","北宋:全景式构图,主峰堂堂,大山大水,客观写真、雄浑壮美(荆关李范郭);南宋:边角之景,一角半边,虚旷空灵,主观诗意(马夏);由写真图貌转向抒情造境。",0,"","j"],
["c","五代两宋","五代两宋山水画的发展演变","五代荆关董巨开南北两派→北宋李成范宽全景巨嶂→郭熙集院体大成→王希孟《千里江山图》青绿再盛→南宋李唐变体、马夏边角;由雄浑全景走向诗意边角,笔墨意境不断深化。",1,"24","l"],
["c","元代","赵孟頫","元初书画领袖,宋宗室而仕元;提出「作画贵有古意」与「书画本来同」(以书入画);越过南宋上追晋唐北宋,变刚劲为温润雅逸;《鹊华秋色图》《秀石疏林图》;楷书四大家之一;为元代文人画确立方向,元四家皆受其影响。",3,"17·18·24","n"],
["c","元代","士气说","元初钱选与赵孟頫问答中提出;谓士夫画贵有「士气」,要在「隶体」——以书法笔意作画,不求形似,重学养逸气;区别于画工画;文人画理论的核心命题。",1,"25","n"],
["c","元代","元四家","黄公望、吴镇、倪瓒、王蒙;皆宗董巨而各成一家:黄苍润简远(《富春山居图》)、吴湿润沉郁(《渔父图》)、倪萧疏简逸(《渔庄秋霁图》)、王繁密深秀(《青卞隐居图》);以水墨写胸中逸气,诗书画印一体;把文人山水推向高峰,为明清南宗典范。",3,"14·16·19","l"],
["c","元代","倪瓒","元四家之一,号云林;「一河两岸」三段式构图,折带皴、枯笔淡墨,极简极净;「逸笔草草,不求形似,聊以自娱」;《渔庄秋霁图》《六君子图》;逸品典范,明清「家家一峰,人人云林」。",0,"","j"],
["c","元代","永乐宫壁画","元代山西芮城永乐宫道教壁画;三清殿《朝元图》绘290余身神祇朝谒元始天尊,人物高逾两米;线描圆浑遒劲,重彩勾填沥粉贴金;元代寺观壁画最高成就。",0,"","n"],
["c","元代","元代绘画的新特点","文人画跃居主流;倡以书入画,笔墨趣味独立;诗书画印结合成定式;重意趣轻形似,尚简逸;题材集中于山水与梅兰竹菊;纸本水墨盛行;画家多隐逸之士,画为寄兴之具。",0,"","j"],
["c","元代","从宋到元艺术风格转变及原因","转变:由院体格法写实转向文人写意,绢本重彩转向纸本水墨,状物转向抒情。原因:元废画院、士人失路而隐于艺;遗民借笔墨寄故国之思;赵孟頫复古理论引导;禅道思想浸润;文人诗书画传统成熟。",1,"25","l"],
["c","元代","元青花","元代景德镇烧成的成熟青花瓷;钴料绘胎、罩透明釉高温一次烧成;构图繁密层次丰富,纹样有缠枝花卉、人物故事(《鬼谷子下山》罐);开启彩绘瓷时代,远销海外。",0,"","n"],
["c","明代","浙派与戴进","明前期职业画派;钱塘戴进开派(《风雨归舟图》),吴伟继起(别支江夏派);取法南宋马夏,水墨苍劲豪放;与宫廷绘画相表里,盛极一时;后期流于粗硬,渐为吴门取代。",0,"","n"],
["c","明代","吴门四家","明中期苏州沈周、文徵明、唐寅、仇英;沈文承元四家文人传统(粗沈细文),书卷温雅;唐寅融院体与文人趣味;仇英工笔重彩;使文人画重心移至苏州,雅俗共赏,主导明代中后期画坛。",2,"17·22","n"],
["c","明代","青藤白阳","明代大写意花鸟双璧:陈淳(白阳山人)与徐渭(青藤道士);白阳放逸洒脱、水墨淋漓;青藤纵横恣肆、走笔如飞;把写意花鸟推向抒写性灵的高峰。",0,"","n"],
["c","明代","徐渭","明代大写意花鸟开派者,号青藤;一生落魄,以画泄愤;泼墨淋漓,不求形似求生韵;以草书笔法入画;《墨葡萄图》题「笔底明珠无处卖」;影响八大、石涛、扬州八怪以至吴昌硕、齐白石。",1,"12","j"],
["c","明代","陈洪绶","明末人物画大家,号老莲;造型夸张变形,「高古奇骇」;线描清圆细劲,富装饰意味;版画成就卓著(《九歌图》《水浒叶子》《西厢记》插图);晚明变形主义代表,影响清代及近代人物画与版画。",1,"23","j"],
["c","明代","波臣派","明末曾鲸(字波臣)开创的肖像画派;创「墨骨法」:先以淡墨烘染面部结构,再层层敷色,「如镜取影,妙得神情」;参用西法而归于传统;弟子众多,主导明清肖像画坛。",0,"","n"],
["c","明代","董其昌","晚明书画领袖、松江派主将;提出南北宗论,崇南贬北;画风秀润苍郁,强调笔墨自身意趣;书法冲淡秀逸。正面:凸显笔墨独立价值,总结文人画理论;负面:导摹古之风,四王承其衣钵而致清代山水陈陈相因。",3,"14·19·23","l"],
["c","明代","南北宗论","董其昌借禅家南北分宗比附山水画史;北宗祖李思训父子着色山水,为行家渐修;南宗祖王维水墨渲淡,为利家顿悟;崇南抑北,确立文人画正统谱系;影响深远,亦失之武断。",0,"","n"],
["c","明代","明式家具","明至清前期以黄花梨、紫檀等硬木制作的家具;造型简练、线条流畅、比例适度;榫卯结构科学,不施繁饰,尽显木质天然纹理之美;实用与审美统一的典范。",0,"","n"],
["c","明代","吴门画派与元四家旨趣差异","元四家多遗民隐士,画为自娱寄兴,萧散荒寒、孤高出世;吴门身处繁华苏州,亦自娱亦鬻艺,题材贴近文人生活与园林雅集,温雅平和、雅俗共赏;由出世之逸转向入世之雅。",0,"","j"],
["c","清代","四王(清六家)","清初王时敏、王鉴、王翚、王原祁;奉董其昌衣钵,以仿古集大成为宗旨;笔墨功力精深(王原祁干笔积墨尤有创获);被奉为画坛正统;然脱离造化、创造不足;加吴历、恽寿平称「清六家」。",2,"20·25","n"],
["c","清代","清初四王绘画的得失","得:系统总结宋元笔墨程式,集古法大成,便于传承;干笔渴墨、龙脉布局有所推进。失:以摹古为能事,构图陈陈相因,脱离自然与生活,束缚个性,致正统山水日趋僵化。",1,"20","j"],
["c","清代","四僧","清初遗民画僧石涛、八大山人、髡残、弘仁;借书画抒亡国之痛与个性;主张师造化、「我用我法」,与四王摹古相对;石涛恣肆、八大冷逸、髡残苍莽、弘仁清刚;影响扬州八怪与近现代写意画。",2,"17·18","n"],
["c","清代","石涛的绘画理论","著《苦瓜和尚画语录》;核心「一画论」:一画者众有之本、万象之根,法自我立;倡「笔墨当随时代」「搜尽奇峰打草稿」「借古以开今」;强调师造化与抒发个性;古代画论高峰,近现代国画革新的理论旗帜。",1,"24","l"],
["c","清代","八大山人","朱耷,明宗室,国亡为僧;花鸟造型冷逸夸张,鱼鸟白眼向天;构图奇简、笔墨凝练,「墨点无多泪点多」;署名连缀似「哭之笑之」;将水墨写意花鸟推向极致。",0,"","n"],
["c","清代","扬州八怪","清中期扬州的革新派职业文人画家群(金农、郑燮、黄慎、李鱓、汪士慎、罗聘等);承徐渭、石涛写意传统;题材世俗化、书画商品化;笔墨恣肆、个性鲜明;「怪」在离经叛道,开近代写意花鸟先声。",0,"","n"],
["c","清代","郑板桥","扬州八怪代表,名燮;诗书画三绝,专写兰竹石;提出「眼中之竹—胸中之竹—手中之竹」;自创六分半书(乱石铺街);「一枝一叶总关情」,画寄民瘼。",0,"","n"],
["c","清代","恽寿平","清六家之一,号南田;复兴徐崇嗣「没骨法」,不勾轮廓,直接以色点染写生;花卉明丽秀雅,「惟能极似,乃称与花传神」;开常州画派,影响宫廷与民间花鸟画百余年。",2,"20·21","j"],
["c","清代","郎世宁","意大利传教士画家,历仕康雍乾三朝;融西方明暗、透视、解剖于中国工笔,弱化阴影以合帝王之好;《百骏图》《乾隆大阅图》;创中西合璧的清宫新体画风。",0,"","n"],
["c","清代","中西交流对清代宫廷画风的影响","传教士画家郎世宁、王致诚等供奉内廷;带来焦点透视、明暗晕染与写实肖像法;与中国画家合作形成「线法画」与中西合璧新体;纪实绘画精细逼真;然影响囿于宫廷,未撼动文人画主流。",1,"25","l"],
["c","清代","粉彩","清康熙晚期创烧、雍正极盛的釉上彩瓷;彩料掺「玻璃白」打底并以渲染法施彩;色调粉润柔和、浓淡分明,别于五彩之硬朗,故称软彩;雍正粉彩为清瓷绝品。",0,"","n"],
["c","清代","海上画派","晚清上海开埠后形成的画家群;前期以任伯年为杰出代表(三任、虚谷),后期以吴昌硕为领袖;承文人画传统而趋雅俗共赏:题材吉祥世俗、色彩明快、金石入画;适应市民趣味与商业环境,开近代中国画新局。",2,"21·25","n"],
["c","清代","海派对文人画的继承和发展","继承:徐渭、八大、扬州八怪以来的写意笔墨与诗书画印传统;发展:题材面向市井与吉祥寓意,设色鲜丽大胆(西洋红),以金石书法强其骨(吴昌硕),书画公开鬻卖、雅俗共赏;使文人画从书斋走向市场大众,完成近代转型。",2,"21·25","l"],
["c","近现代","岭南画派","高剑父、高奇峰、陈树人(二高一陈)创于广东;师承居巢、居廉;主张「折衷中西,融汇古今」,倡艺术革命与新国画;融日本画法与西画写实,重写生渲染与时代题材。",1,"24","n"],
["c","近现代","岭南画派对文人画的继承和发展","继承:笔墨骨法与诗意境界;发展:引入西画与日本画的写实造型、光影空气渲染;题材扩至飞机汽车等现实事物,直面时代;主张艺术面向大众、服务社会,突破文人画自娱与摹古传统。",1,"24","j"],
["c","近现代","吴昌硕","海派后期领袖;诗书画印四绝;以石鼓文笔法入画,「以作书之法作画」,大写意花卉浑厚苍劲、金石气盎然;设色大胆用西洋红;直接影响齐白石、潘天寿等,承前启后的一代宗师。",2,"21·25","j"],
["c","近现代","任伯年","海派前期巨匠;人物、花鸟、肖像俱精;承陈洪绶传统,参以民间画与西画速写;《群仙祝寿图》《酸寒尉像》;设色明净、构图新巧,雅俗共赏;近代人物画高峰。",0,"","n"],
["c","近现代","徐悲鸿","画家、美术教育家,留学法国;主张以写实主义改良中国画,「素描为一切造型艺术之基础」;《愚公移山》《奔马》,油画《田横五百士》;执掌中大艺术系、北平艺专、中央美院,建立写实教学体系(徐蒋体系),深刻塑造新中国美术格局。",1,"25","j"],
["c","近现代","林风眠","画家、美术教育家,国立艺术院首任院长;主张「调和中西艺术,创造时代艺术」;融西方现代主义与民间瓷绘、传统线描;方形构图,仕女、芦雁、秋林自成一格;开中国画现代转型之路,门下有吴冠中、赵无极等。",0,"","j"],
["c","近现代","刘海粟","创办上海图画美术院(上海美专),首倡旅行写生、首用人体模特教学,自称「艺术叛徒」;画风融后印象派与石涛;十上黄山,晚年泼彩淋漓。",0,"","n"],
["c","近现代","齐白石","木匠出身的艺术大师;衰年变法,创「红花墨叶」一派;主张「妙在似与不似之间」;花鸟鱼虫质朴天真,兼工带写;书法篆刻单刀直入;人民艺术家,把文人画引向民间生活。",0,"","n"],
["c","近现代","黄宾虹","近现代山水画大师、美术史论家;总结「五笔七墨」(平圆留重变;浓淡破泼渍焦宿);晚年黑密厚重、浑厚华滋;「江山本如画,内美静中参」;影响当代山水至深。",0,"","n"],
["c","近现代","傅抱石","近现代山水人物画家、美术史家;创「抱石皴」,散锋乱笔写山川氤氲;金刚坡时期沉雄奇崛;与关山月合作《江山如此多娇》;「思想变了,笔墨就不能不变」。",0,"","n"],
["c","近现代","决澜社","1932年庞薰琹、倪贻德等创于上海;中国最早自觉引进西方现代主义的美术社团;宣言抨击画坛「衰颓与病弱」,主张以野兽派、立体派等新兴之风创造新艺术;共办四回展,1935年后解散;昙花一现而意义深远。",1,"20","n"],
["c","近现代","月份牌年画","清末民初上海兴起的商业广告画;擦笔素描加水彩绘制,多为时装美女与吉祥题材;随商品赠送而风行;郑曼陀、杭稚英为名家;中西结合的近代商业美术产物。",0,"","n"],
["c","近现代","木版年画","民间木版印制的节令装饰画;题材求吉纳福(门神、娃娃、戏文);三大产地:天津杨柳青(细腻雅致)、苏州桃花坞(秀雅工丽)、山东杨家埠(质朴红火);民间美术的重要遗产。",0,"","n"],

["f","史前","母神雕像(维伦多夫的维纳斯)","旧石器晚期小型女性雕像;夸张乳、腹、臀而略去五官四肢;《维伦多夫的维纳斯》(奥地利出土,石灰石,约11厘米)最著名;反映原始生殖崇拜与丰产祈愿。",2,"13·20","n"],
["f","史前","拉斯科洞窟壁画","法国旧石器晚期洞窟壁画;绘野牛、野马、鹿等动物,轮廓粗犷、色彩浓重(红黑褐)、充满动感,大厅巨牛长逾5米;有「史前卢浮宫」之称,或与狩猎巫术相关。",1,"23","n"],
["f","史前","阿尔塔米拉洞窟壁画","西班牙旧石器晚期洞窟壁画;窟顶《受伤的野牛》利用岩壁凹凸表现体积,浑厚写实;1879年最早被发现的史前洞窟壁画;史前绘画最高成就之一,「史前的西斯廷」。",2,"17·22","n"],
["f","史前","拉文特岩画","西班牙东部沿海中石器时代露天岩画;以人物活动为中心(狩猎、舞蹈、采集、战争);剪影式造型,形体简化夸张,富节奏与叙事性;与旧石器洞窟动物壁画形成对照。",1,"24","n"],
["f","史前","诺克雕塑","西非尼日利亚诺克文化赤陶雕塑(约公元前5世纪起);人头像作圆柱、圆锥几何化造型,眼呈三角形穿孔;非洲已知最早的雕塑传统,影响后世非洲木雕风格。",0,"","n"],
["f","古代东方","吉萨金字塔群","古埃及古王国法老陵墓群;胡夫、哈夫拉、孟卡拉三大金字塔与狮身人面像;精确宏大的方锥体,简洁崇高;体现「来世永恒」观念与法老权力;古代七大奇迹仅存者。",0,"","n"],
["f","古代东方","正面律","古埃及人物造型程式:头部为侧面而眼睛为正面,肩胸正面,腰以下侧面;不求视觉真实,而求形体完整以供灵魂永驻;贯穿埃及浮雕壁画约三千年。",0,"","n"],
["f","古代东方","方尖碑","古埃及崇拜太阳神的纪念碑;整块花岗岩琢成,方柱体、顶为金字塔形(常包金),四面镌刻象形文字;成对立于神庙塔门前;后多被罗马等运走,散立欧洲广场。",1,"24","n"],
["f","古代东方","汉谟拉比法典碑","古巴比伦石碑;上部浮雕太阳神沙玛什向汉谟拉比授予权标绳环,下刻楔形文字法典全文;「君权神授」的最早图解之一;古西亚浮雕代表,现藏卢浮宫。",0,"","n"],
["f","古代东方","亚述宫殿浮雕(拉玛苏)","装饰亚述王宫墙面的叙事浮雕;以战争狩猎颂扬王权,动物刻画尤精(《垂死的母狮》),写实刚健而残酷;门侧置人首翼牛「拉玛苏」,雕五腿兼顾两视角;亚述为西亚美术之集大成者。",0,"","j"],
["f","古代东方","两河流域美术四个时期","苏美尔—阿卡德(乌尔军旗、纳拉姆·辛纪功碑)→古巴比伦(汉谟拉比法典碑)→亚述(宫殿浮雕、拉玛苏)→新巴比伦(伊什塔尔门琉璃砖);政权更迭频繁,美术围绕王权与宗教,写实叙事与装饰华丽并重。",2,"15·16","j"],
["f","古代东方","波斯波利斯王宫建筑群","波斯帝国(阿契美尼德王朝)的礼仪都城;百柱大厅气势恢宏,大流士接见厅阶梯浮雕刻万国来朝行列;集两河、埃及、希腊诸邦工匠技艺;中东古代美术的集大成。",0,"","n"],
["f","古代东方","特奥蒂华坎与太阳金字塔","墨西哥特奥蒂华坎古城(众神之城);沿「亡灵大道」轴线布局,主体太阳金字塔为阶梯形巨构,顶置神庙;美洲古代城市与宗教建筑的代表。",0,"","n"],
["f","古代东方","玛雅美术","中美洲玛雅文明美术;阶梯金字塔神庙(蒂卡尔)、石碑浮雕与象形文字、博南帕克壁画;历法数学发达;被誉为「美洲的希腊」,拉美古代文化最昌盛的民族之一。",0,"","j"],
["f","希腊罗马","爱琴美术","约前3000—前1200年爱琴海区域美术,含克里特与迈锡尼;克里特:克诺索斯王宫及壁画(《巴黎女郎》),明快优雅、富自然生趣;迈锡尼:狮子门、金器,雄浑尚武;古希腊美术的先驱与摇篮。",1,"24","j"],
["f","希腊罗马","希腊三柱式","多立克式:无柱础、柱身粗壮,刚健庄重(帕特农神庙);爱奥尼亚式:修长、柱头饰涡卷,秀美典雅(胜利女神庙);科林斯式:柱头如毛茛叶花篮,华丽纤巧;西方古典建筑的基本语言。",1,"23","j"],
["f","希腊罗马","帕特农神庙","雅典卫城主神庙,祀雅典娜(前447—前438年);围柱式多立克典范,兼取爱奥尼亚因素;运用卷杀等视觉校正臻于完美;菲底亚斯主持雕刻装饰;古典建筑最高成就。",0,"","n"],
["f","希腊罗马","希腊瓶画的三种风格","黑绘式:红底上绘黑色剪影人物,细部刻线(《阿喀琉斯与埃阿斯玩骰子》);红绘式(约前530年起):底黑留红,可勾画细节,表现力大增;白底彩绘式:多用于祭奠白瓶;了解希腊绘画的主要实物遗存。",2,"17·22","j"],
["f","希腊罗马","菲底亚斯","古希腊古典盛期最伟大的雕刻家;主持帕特农神庙雕刻(《命运三女神》、饰带浮雕);作黄金象牙巨像《雅典娜》与奥林匹亚《宙斯》(古代七大奇迹之一);庄严崇高,「高贵的单纯,静穆的伟大」之典范。",1,"19","n"],
["f","希腊罗马","米隆《掷铁饼者》","古典早期青铜雕像(存罗马大理石摹本);选取掷饼前蓄力一瞬,重心与张力完美平衡,静中蓄动;解决雕塑表现运动的课题,竞技雕塑的里程碑。",0,"","n"],
["f","希腊罗马","《米洛斯的阿弗洛狄特》","希腊化时期大理石雕像(断臂维纳斯);S形站姿,半裸衣裙,端庄典雅兼具柔美;断臂反添想象之美;1820年米洛斯岛出土,卢浮宫三宝之一。",0,"","n"],
["f","希腊罗马","拉奥孔群像","希腊化时期罗得岛三雕刻家所作大理石群雕;特洛伊祭司拉奥孔父子三人被海蛇缠咬,肌体扭曲、痛苦挣扎;充满悲剧激情与戏剧性,希腊化风格的代表;1506年出土,深刻影响米开朗基罗;莱辛借之著《拉奥孔》论诗画界限。",4,"12·18·23·25","n"],
["f","希腊罗马","希腊古典与希腊化雕塑比较","古典时期:理想化、静穆和谐、法则严谨(菲底亚斯、波利克里托斯《法则》);希腊化时期:世俗化个性化,追求激情动感与戏剧性(拉奥孔、萨莫色雷斯的胜利女神);由神性宁静转向人间激荡。",0,"","j"],
["f","希腊罗马","庞贝壁画的四种风格","一镶嵌风格:仿彩色大理石贴面;二建筑结构风格:绘幻觉建筑扩展空间;三埃及风格:单色墙面饰精致小画与图案;四庞贝巴洛克:繁复炫目堆砌幻景;因公元79年维苏威火山掩埋而保存,罗马绘画最重要的遗存。",1,"13","j"],
["f","希腊罗马","古罗马肖像雕刻","源于祖先蜡像崇拜,故极端写实、不避皱纹缺陷;重个性与心理(《卡拉卡拉像》见其残暴);帝王像趋理想化(《奥古斯都像》);风格由质朴写实到美化再回归写实;开西方写实肖像传统。",0,"","j"],
["f","希腊罗马","法尤姆肖像画","罗马统治时期埃及法尤姆地区的木乃伊面板肖像;蜡彩(热蜡)画法;正面注视、目光炯炯,写实而有灵性;现存最早的架上肖像画群,连接古典绘画与拜占庭圣像。",0,"","n"],
["f","希腊罗马","图拉真纪功柱","罗马纪念图拉真远征达契亚胜利的纪念柱;柱身螺旋浮雕带长约200米、人物2500余,连续叙事记录战争全程;罗马纪念性与叙事性雕刻的代表。",0,"","n"],
["f","宗教美术","镶嵌画","以彩色玻璃料块、石子、金箔片拼嵌于墙面的装饰画;拜占庭教堂运用登峰造极(拉文纳圣维塔莱教堂《查士丁尼皇帝与廷臣》);色彩闪烁、金光神秘,营造天国氛围;拜占庭美术的代表形式。",1,"24","n"],
["f","宗教美术","拜占庭美术","东罗马帝国基督教美术;建筑以圣索菲亚大教堂为巅峰(帆拱承巨大穹顶,光线迷离);镶嵌画金碧辉煌,圣像画高度程式化;庄严、华丽、神秘;深刻影响东欧与俄罗斯艺术。",0,"","j"],
["f","宗教美术","罗马式美术","10—12世纪西欧基督教美术;教堂沿用罗马半圆拱与筒拱:石墙厚重、窗小塔坚,如上帝的堡垒(比萨大教堂群);雕刻依附建筑、变形夸张具威慑力;体现隐修禁欲精神。",1,"20","n"],
["f","宗教美术","哥特式美术","12—15世纪西欧美术;以尖拱、肋拱与飞扶壁使教堂墙薄窗大、高耸入云(巴黎圣母院、夏特尔、科隆大教堂);彩色玻璃窗画取代壁画;雕刻趋自然温和(《微笑的天使》);中世纪美术最高成就。",0,"","n"],
["f","宗教美术","彩色玻璃窗画","哥特式教堂以铅条镶嵌彩色玻璃构成的窗画;题材为圣经故事与圣徒事迹;阳光透射,红蓝宝石般光色营造「天国神启」氛围;兼具采光、图解教义(穷人的圣经)与神秘体验功能;夏特尔教堂、巴黎圣礼拜堂为极品。",1,"25","j"],
["f","宗教美术","加洛林文艺复兴","8—9世纪查理曼大帝提倡的古典文化复兴;设宫廷学院、整理典籍;手抄本插图、象牙雕与金工繁荣(《查理曼福音书》);为中世纪西欧保存并传递古典传统。",0,"","n"],

const SUBJ={c:{name:"中国美术史",color:"var(--cn)"},f:{name:"外国美术史",color:"var(--fw)"}};
const KIND={n:"名词解释",j:"简答",l:"论述"};
const IVL=[0,1,2,4,7,15,30]; // 艾宾浩斯复习间隔(天)
const DAY=86400000;
const BUILT=D.map((d,i)=>({id:"b"+i,s:d[0],ch:d[1],t:d[2],a:d[3],f:d[4],y:d[5],k:d[6],tags:[]}));

/* ================= 存储 ================= */
const KEY="msart_store_v2";
let ST={custom:[],overrides:{},hidden:[],favs:{},srs:{},log:{},goal:20};
try{const r=localStorage.getItem(KEY);if(r)ST=Object.assign(ST,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){alert("保存失败:存储空间可能已满");}}
function today(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function dayKey(off){const d=new Date(Date.now()-off*DAY);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}

/* ================= 数据访问 ================= */
function cards(){
  return BUILT.filter(c=>!ST.hidden.includes(c.id))
    .map(c=>ST.overrides[c.id]?Object.assign({},c,ST.overrides[c.id]):c)
    .concat(ST.custom);
}
function getCard(id){return cards().find(c=>c.id===id);}
function box(id){return (ST.srs[id]&&ST.srs[id].b)||0;}
function isDue(id){const s=ST.srs[id];return s&&s.due<=endOfToday();}
function endOfToday(){const d=new Date();d.setHours(23,59,59,999);return d.getTime();}
function grade(id,g){ // 0没记住 1模糊 2记住
  const cur=box(id);
  const nb=g===2?Math.min(cur+1,6):(g===1?1:0);
  ST.srs[id]={b:nb,due:Date.now()+IVL[nb]*DAY,seen:1};
  ST.log[today()]=(ST.log[today()]||0)+1;
  save();
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= 全局状态 ================= */
let S={tab:"home",sess:null,f:{s:"all",ch:"all",hot:false,fav:false},q:"",tagF:"all",modal:null};

function filtered(){
  return cards().filter(c=>
    (S.f.s==="all"||c.s===S.f.s)&&
    (S.f.ch==="all"||c.ch===S.f.ch)&&
    (!S.f.hot||c.f>=2)&&
    (!S.f.fav||ST.favs[c.id]));
}
function chapters(){const set=[];cards().forEach(c=>{if((S.f.s==="all"||c.s===S.f.s)&&!set.includes(c.ch))set.push(c.ch);});return set;}

  if(!pool.length){alert("当前范围没有可学的词条~换个筛选试试");return;}
  const q=shuffle(pool).sort((a,b)=>{const ba=box(a.id),bb=box(b.id);if(ba!==bb)return ba-bb;return b.f-a.f;});
  S.sess={kind,queue:q,i:0,flip:false,pick:null,reveal:false,txt:"",ok:0,no:0,title,opts:[]};
  if(kind==="quiz")makeOpts();
  render();
}
function makeOpts(){
  const c=S.sess.queue[S.sess.i];
  const pool=cards().filter(x=>x.k==="n"&&x.s===c.s&&x.id!==c.id);
  const same=shuffle(pool.filter(x=>x.ch===c.ch)),rest=shuffle(pool.filter(x=>x.ch!==c.ch));
  S.sess.opts=shuffle([c].concat(same.concat(rest).slice(0,3)));
}
function doGrade(g){
  const sess=S.sess,c=sess.queue[sess.i];
  grade(c.id,g);
  g===2?sess.ok++:sess.no++;
  next();
}
function next(){
  const s=S.sess;
  if(s.i+1>=s.queue.length){s.i=-1;render();return;} // -1=完成页
  s.i++;s.flip=false;s.pick=null;s.reveal=false;s.txt="";
  if(s.kind==="quiz")makeOpts();
  render();
}
function quit(){S.sess=null;render();}

/* ---------- OCR 扫描录入 ---------- */
let tessReady=null;
function loadTess(){
  if(window.Tesseract)return Promise.resolve();
  if(tessReady)return tessReady;
  tessReady=new Promise((ok,no)=>{
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload=ok;s.onerror=()=>no(new Error("识别组件加载失败,请检查网络"));
    document.head.appendChild(s);
  });
  return tessReady;
}
function downscale(file,max){
  return new Promise((ok,no)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      const r=Math.min(1,max/Math.max(w,h));
      const cv=document.createElement("canvas");
      cv.width=Math.round(w*r);cv.height=Math.round(h*r);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(img.src);ok(cv);
    };
    img.onerror=no;
    img.src=URL.createObjectURL(file);
  });
}
async function doOCR(inp){
  const files=[...inp.files];inp.value="";
  if(!files.length)return;
  const st=document.getElementById("ocrStatus");
  try{
    st.textContent="正在加载识别组件…(首次使用需联网,请稍候)";
    await loadTess();
    for(let i=0;i<files.length;i++){
      st.textContent=`第${i+1}/${files.length}页 预处理…`;
      const cv=await downscale(files[i],1700);
      const r=await Tesseract.recognize(cv,"chi_sim",{logger:m=>{
        if(m.status==="recognizing text")st.textContent=`第${i+1}/${files.length}页 识别中 ${Math.round(m.progress*100)}%`;
        else if(m.status&&m.progress<1)st.textContent=`第${i+1}/${files.length}页 准备中…`;
      }});
      let t=(r.data.text||"").trim();
      t=t.replace(/(?<=[\u4e00-\u9fff、。,！？；：“”（）〈〉《》])[ \t]+(?=[\u4e00-\u9fff、。，！？；：“”（）〈〉《》])/g,"");
      S.scanText=(S.scanText?S.scanText+"\n\n":"")+t;
      const ta=document.getElementById("ocrText");if(ta)ta.value=S.scanText;
    }
    st.textContent="✅ 识别完成,请检查修改;还可继续拍下一页";
  }catch(e){st.textContent="❌ "+(e.message||"识别失败,请重试");}
}
function tidyOCR(t){
  let lines=t.split(/\r?\n/).map(x=>x.trim());
  lines=lines.filter(x=>!/^[-—·.\d\s]{1,8}$/.test(x)||x==="");
  lines=lines.filter(x=>!/^第?\s*\d+\s*页$/.test(x));
  const out=[];
  for(const x of lines){
    if(!x){if(out.length&&out[out.length-1]!=="")out.push("");continue;}
    const prev=out.length?out[out.length-1]:null;
    if(prev&&prev!==""&&!/[。！？；：…”』」）)]$/.test(prev))out[out.length-1]=prev+x;
    else out.push(x);
  }
  return out.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
function tidyBtn(){
  S.scanText=tidyOCR(S.scanText||"");
  const ta=document.getElementById("ocrText");if(ta)ta.value=S.scanText;
  const st=document.getElementById("ocrStatus");if(st)st.textContent="✨ 已整理:去杂行、拼断句、留段落";
}
function scanToForm(){
  const t=(S.scanText||"").trim();
  if(!t){alert("还没有识别到文字哦");return;}
  const lines=t.split("\n").filter(Boolean);
  let title="",body=t;
  if(lines[0]&&lines[0].length<=14&&!/[。，,！？]/.test(lines[0])){title=lines[0];body=t.slice(t.indexOf(lines[0])+lines[0].length).trim();}
  S.scanText="";
  S.modal={type:"form",id:null,pre:{t:title,a:body}};
  render();
}
function saveForm(id){
  const v=x=>document.getElementById(x).value;
  const nc={s:v("fs"),ch:v("fch").trim()||"未分类",t:v("ft").trim(),a:v("fa").trim(),k:v("fk"),
    tags:v("ftg").split(/[,，]/).map(x=>x.trim()).filter(Boolean)};
  if(!nc.t||!nc.a){alert("词条名称和要点内容不能为空");return;}
  if(!id){ // 新建
    nc.id="u"+Date.now();nc.f=0;nc.y="";
    ST.custom.push(nc);
  }else if(id.startsWith("u")){ // 编辑自建
    const i=ST.custom.findIndex(c=>c.id===id);
    if(i>-1)ST.custom[i]=Object.assign(ST.custom[i],nc);
  }else{ // 编辑内置 → 覆盖层
    ST.overrides[id]=Object.assign(ST.overrides[id]||{},nc,{id});
  }
  save();S.modal=null;render();
}
function delCard(id){
  if(!confirm("确定删除这个词条?"))return;
  if(id.startsWith("u"))ST.custom=ST.custom.filter(c=>c.id!==id);
  else if(!ST.hidden.includes(id))ST.hidden.push(id);
  delete ST.favs[id];delete ST.srs[id];
  save();S.modal=null;render();
}

function nodeHTML(n){
  const label=typeof n==="string"?n:n[0];
  const kids=typeof n==="string"?[]:(n[1]||[]);
  const c=cards().find(x=>x.t===label);
  const self=c?`<span class="mnode mlink" style="border-color:${SUBJ[c.s].color};color:${SUBJ[c.s].color}" onclick="S.modal={type:'detail',id:'${c.id}'};render()">${esc(label)} ›</span>`
             :`<span class="mnode">${esc(label)}</span>`;
  return `<div>${self}${kids.length?`<div class="mkids">${kids.map(nodeHTML).join("")}</div>`:""}</div>`;
}

/* ================= 统计 ================= */
function renderStats(){
  const all=cards();
  const mastered=all.filter(c=>box(c.id)>=4).length;
  const learning=all.filter(c=>ST.srs[c.id]&&box(c.id)<4).length;
  const fresh=all.length-mastered-learning;
  const days=[];let mx=1;
  for(let i=6;i>=0;i--){const n=ST.log[dayKey(i)]||0;days.push([i===0?"今天":dayKey(i).split("-").slice(1).join("/"),n]);mx=Math.max(mx,n);}
  const total7=days.reduce((s,d)=>s+d[1],0);
  const chStat={};
  all.forEach(c=>{const k=SUBJ[c.s].name+"·"+c.ch;chStat[k]=chStat[k]||[0,0];chStat[k][1]++;if(box(c.id)>=4)chStat[k][0]++;});
  app.innerHTML=`
  <h1 class="serif" style="font-size:20px;letter-spacing:3px">学习统计</h1>
  <div class="card"><div class="stat">
    <div><b>${all.length}</b><span>总词条</span></div>
    <div><b style="color:var(--ok)">${mastered}</b><span>已掌握</span></div>
    <div><b style="color:var(--warn)">${learning}</b><span>学习中</span></div>
    <div><b style="color:var(--mute)">${fresh}</b><span>未学</span></div>
  </div>
  <div class="bar mt"><i style="width:${Math.round(mastered/all.length*100)}%;background:var(--ok)"></i></div>
  <div class="muted center" style="margin-top:4px">总掌握率 ${Math.round(mastered/all.length*100)}%(连续答对4次算掌握)</div></div>
  <div class="card"><b>📈 近7天复习量</b> <span class="muted">共 ${total7} 次</span>
    <div class="cols">${days.map(([l,n])=>`<div><i style="height:${Math.round(n/mx*70)+2}px"></i>${n}<br>${l}</div>`).join("")}</div></div>
  <div class="card"><b>📂 各章节掌握度</b>
    ${Object.entries(chStat).map(([k,[m,t]])=>`
      <div class="row" style="margin-top:10px"><span style="font-size:12px;width:150px;flex:none">${esc(k)}</span>
      <div class="bar grow"><i style="width:${Math.round(m/t*100)}%"></i></div>
      <span class="muted" style="flex:none">${m}/${t}</span></div>`).join("")}
  </div>`;
}

function exportData(){
  const blob=new Blob([JSON.stringify({app:"msart",ver:2,data:ST})],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="美术史背诵备份_"+today()+".json";
  a.click();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(j.app!=="msart"||!j.data)throw 0;
      ST=Object.assign({custom:[],overrides:{},hidden:[],favs:{},srs:{},log:{},goal:20},j.data);
      save();alert("导入成功!");render();
    }catch(e){alert("导入失败:文件格式不对");}
  };
  r.readAsText(f);inp.value="";
}
function resetProgress(){ST.srs={};ST.log={};save();render();}
function factoryReset(){ST={custom:[],overrides:{},hidden:[],favs:{},srs:{},log:{},goal:20};save();render();}
